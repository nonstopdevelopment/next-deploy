name: Deploy to External Registry

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase Repo Name
      id: repo_name
      run: echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.repo_lower }}
        tags: |
          type=sha,format=long
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Notify Launchpad Webhook
      if: success()
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        BODY=$(cat <<EOF
        {
          "repo": "${{ github.repository }}",
          "sha": "${{ github.sha }}",
          "image": "ghcr.io/$REPO_LOWER:latest"
        }
        EOF
        )
        # Generate HMAC-SHA256 signature
        SIGNATURE=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.LAUNCHPAD_WEBHOOK_SECRET }}" -binary | xxd -p -c 256)
        
        curl -X POST "${{ secrets.LAUNCHPAD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -H "x-launchpad-signature: $SIGNATURE" \
          -d "$BODY"
